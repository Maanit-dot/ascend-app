<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASCEND // Initializing JARVIS System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #05060A;
      color: #E8EEFF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .arc-glow {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px dashed #00E5FF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
      animation: spin 8s linear infinite;
    }
    .arc-inner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #2614DF;
      background: radial-gradient(circle, #01C0D7 10%, #0C081D 80%);
      box-shadow: 0 0 20px #00E5FF;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    h1 {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    }
    p {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #00E5FF;
      font-family: monospace;
    }
    .dots::after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }
  </style>
</head>
<body>
  <div class="arc-glow">
    <div class="arc-inner"></div>
  </div>
  <h1>ASCEND</h1>
  <p>INITIALIZING JARVIS NEURAL ARCHITECTURE<span class="dots"></span></p>
</body>
</html>
